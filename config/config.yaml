# config.yaml — RSIB 전략 파라미터 (SPEC.md 단일 진실 소스, 코드 하드코딩 금지)
#
# 변경 이력(2026-07-24, Phase 2 G1 결과 기반 재설계 — PROGRESS.md/BACKTEST_BASELINE.md 참조):
# - meanrev 전략 기각(SPEC 4절: PF 0.85, 평균 R 0.054, BTC만 PF 0.67 — 파라미터
#   튜닝이 아니라 전략 자체 문제로 판단). active_strategies에서 제외, 코드는
#   보존(src/strategy/meanrev.py, 테스트 그대로 유지 — 향후 다른 진입조건으로
#   재설계할 수 있음).
# - trend에 require_confirmation_bar 추가(휩쏘 대응, 후보 A). 이 값은 전체구간
#   재백테스트로 확정하지 않고 Phase 3 워크포워드 학습구간에서만 검증한다.

mode: testnet   # CLAUDE.md 규칙 5 — 코드에서 절대 기본값을 live로 두지 않는다. live는 사용자가 직접 바꾼다.

# 2026-07-25: DB 파일 경로의 유일한 진실 소스(G4_PREFLIGHT_CONFIG_CHECK.md
# 확인 4 — 이전엔 확정된 곳이 없어 scripts/healthcheck.py가 자체 추정값을
# 썼다). 프로젝트 루트 기준 상대경로. src/live/state.py::resolve_db_path(cfg)가
# 이 값을 해석하고, src/live/runner.py/scripts/healthcheck.py 둘 다 그
# 함수를 통해서만 db_path를 얻는다(개별 하드코딩 금지).
db_path: "data/state.db"

# ★★★ [2026-07-25 라이브 경로에서 죽은 필드로 확인됨, G4_PREFLIGHT_CONFIG_
# CHECK.md 확인 1/3] active_strategies는 src/backtest/engine.py::
# run_backtest()(레거시 범용 백테스트 엔진, scripts/run_backtest.py·
# run_walkforward.py 전용)에서만 읽힌다. src/live/scheduler.py·
# strategies/filtered_trend.py·strategies/2a.py 어디에도 이 필드를
# 읽는 코드가 없다 — 라이브에서 filtered_trend는 이 값과 무관하게
# 항상 실행된다. 이 값을 바꿔도 라이브 봇 동작은 전혀 안 바뀐다(레거시
# 백테스트 스크립트 실행 결과만 바뀜) — 헷갈리지 말 것.
# 2026-07-24: meanrev 기각(SPEC 4절) — trend 단일 전략으로 축소.
active_strategies: ["trend"]

exchange:
  id: binanceusdm
  # 2026-07-24 (Phase 3 자산 구성 재검토, SPEC 4절 옵션 3): BTC/SOL이 MaxDD·
  # 몬테카를로만 악화시키고 PF에는 도움이 안 됨을 워크포워드로 실증
  # (3페어 합산 G3 MaxDD95%ile 37.7% vs ETH 단독 19.3%, PASS). ETH 단독으로
  # 축소. BTC/SOL 과거 데이터는 삭제하지 않고 보존(향후 재검토용).
  pairs: ["ETH/USDT:USDT"]
  timeframe_trend: "15m"
  timeframe_regime: "1h"

account:
  # 2026-07-25 갱신: 플레이스홀더(10000)를 실제 testnet 잔고로 교체.
  # ★ 라이브 경로(src/live/scheduler.py)에서 이 값은 포지션 사이징에 전혀
  # 쓰이지 않는다 — 실제 사이징은 항상 그 순간의 실제 잔고(exchange.
  # fetch_balance(), scheduler.py::_fetch_total_equity_usd())를 기준으로
  # 한다. 이 값의 유일한 라이브 용도는 scheduler.py의 cumulative_pnl_usd
  # 계산(= 현재 실잔고 - 이 값, 텔레그램 진입/청산 알림에 표시되는 "누적
  # PnL")뿐이다 — 틀려도 사이징 왜곡 없음, 알림에 찍히는 누적손익 표시만
  # 부정확해진다. 게이트 판정(PF/Sharpe/MaxDD%)도 비율 기반이라 이 값
  # 자체엔 영향받지 않는다(risk_per_trade_pct 기반 사이징이라 손익 %
  # 곡선은 자본 규모에 불변) — 백테스트 경로(strategies/filtered_trend.py,
  # src/backtest/engine.py)에서는 시뮬레이션 시작 자본으로 실제 쓰인다.
  initial_equity_usd: 10804.0669
  leverage: 2
  margin_mode: isolated
  risk_per_trade_pct: 0.5
  max_concurrent_positions: 3
  daily_loss_limit_pct: -3.0

costs:
  taker_fee_pct: 0.05
  maker_fee_pct: 0.02
  slippage_pct: 0.03
  funding_interval_hours: 8

regime:
  adx_period: 14
  adx_trend_min: 25
  adx_range_max: 20
  bb_period: 20
  bb_width_percentile_window: 120
  bb_width_percentile_trend_min: 60
  bb_width_percentile_range_max: 40

trend:
  donchian_period: 20
  ema_period: 50
  atr_period: 14
  atr_median_window: 96
  low_vol_filter: true          # ATR(14) >= 최근 96봉 ATR 중위값
  stop_atr_mult: 2.0
  partial_tp_r_multiple: 1.5
  partial_tp_pct: 25
  breakeven_after_partial: true
  chandelier_period: 22
  chandelier_atr_mult: 3.0
  time_exit_bars: 96           # 24h (15m 봉 기준)
  time_exit_min_r: 1.0
  # 후보 A(2026-07-24 재설계): 돌파 봉 즉시 진입 -> 중앙값 보유 11봉짜리 휩쏘가
  # 68.3%(BACKTEST_BASELINE.md). 돌파 다음 1봉이 같은 채널 레벨 위/아래에서
  # 마감할 때만 진입하도록 확인봉 1개 추가. Phase 3 워크포워드에서 검증 예정.
  require_confirmation_bar: true
  # 옵션 1(2026-07-24, 메커니즘 변경 마지막 시도): 진입 후 이 봉수 동안 스탑
  # 체크 미적용. ETH 단독 트레이드 로그 분석(현재 config 기준) — stop_loss
  # 청산 중앙값 18봉(4.5h), 4봉 이내 즉시 스탑은 13.5%뿐. 그 최하위 구간만
  # 겨냥한 고정값(그리드 스윕 안 함, 1h=레짐 판별 주기 1회분과도 자연스럽게 일치).
  stop_grace_period_bars: 4

# 2026-07-24 SPEC 4절 기각(PF 0.85, 평균R 0.054, BTC만 PF 0.67) — active_strategies에서
# 제외됨. 코드/테스트/파라미터는 향후 재설계 참고용으로 보존만 한다.
meanrev:
  bb_period: 20
  bb_std: 2.0
  rsi_period: 14
  rsi_oversold: 30
  rsi_overbought: 70
  atr_period: 14        # SPEC 2.3 스탑 계산용 ATR 기간
  stop_atr_mult: 1.2
  entry_order_type: "limit_next_open"   # 다음 봉 시가 지정가(maker 우선)
  limit_cancel_after_bars: 2
  time_exit_bars: 24           # 6h

data:
  since: "2023-01-01T00:00:00Z"
  ohlcv_cache_dir: "data/ohlcv"
  funding_cache_dir: "data/funding"
  # SPEC 8 [자료 부족] 조사 결과 (Phase 0, DATA_REPORT.md 참조): 테스트넷은 과거
  # OHLCV가 실제 가격이력과 다른 합성 데이터이고 펀딩비 이력도 최근 수일치만
  # 보관된다 — 백테스트용 히스토리 데이터는 반드시 live(프로덕션) 엔드포인트에서
  # 수집한다. testnet은 Phase 4 주문 실행 검증 전용.
  source: "live"

walkforward:
  train_months: 6
  test_months: 2
  # 2026-07-24: meanrev 기각으로 trend 그리드만 남김(3×3=9조합). require_confirmation_bar는
  # 이미 결정된 설계라 그리드에 넣지 않는다 — 학습구간에서도 고정 True로 검증한다
  # (켜고 끄고를 이번 구간 성과로 고르면 과최적화, SPEC 4절).
  grid:
    donchian_period: [15, 20, 25]
    trend_stop_atr_mult: [1.5, 2.0, 2.5]

# 2026-07-25: 2a(횡단면 시장중립 모멘텀) + filtered_trend(trend+1a필터) 2다리
# 포트폴리오 결합 배분. PORTFOLIO_2A_FILTEREDTREND_BACKTEST_NET.md에서 실현
# 주간수익률 표준편차 기반 vol-parity로 1회 산출한 고정값 — 이 config가 로드될
# 때마다 재계산하지 않는다(배분 로직 재탐색 금지, strategies/portfolio_combined.py
# 참조). 값을 바꾸려면 반드시 새 진단 리포트로 재검증 후 갱신할 것.
# 2026-07-25 갱신: POST_FILTER_BUG_AUDIT.md에서 확인된 사후필터링 데이터 오염을
# 정정한 값으로 교체(기존 0.8532/0.1468 -> 0.8383/0.1617). 재탐색 아님 — 같은
# vol-parity 공식을 정정된 leg1(filtered_trend) 데이터로 다시 계산한 결과.
# 상세: reports/VOL_PARITY_RECALC.md, reports/diag_data/audit_vol_parity_sensitivity.csv
# 2026-07-25 재갱신: 2a의 라이브 유니버스를 ETH 제외 19자산으로 정식 채택
# (2A_ETH_EXCLUSION_IMPACT.md)한 데 따라, 그 19자산 2a의 실제 변동성으로
# vol-parity 공식을 다시 적용(0.8383/0.1617 -> 0.8563/0.1437). 여전히 재탐색
# 아님 — 같은 공식, sigma2(2a 변동성)만 실제 라이브 유니버스 기준으로 교체.
# G2/G3 게이트는 새 가중치에서도 PASS 유지(Sharpe 1.843/Calmar 3.446/
# MaxDD 6.58%/MC MaxDD95% 10.55% — 15% 임계치에 근접하지 않음). 다만 20자산
# 기준 대비 여유폭은 줄었다(상세: reports/VOL_PARITY_19ASSET_RECALC.md).
portfolio:
  weights:
    filtered_trend: 0.8562663620801656
    2a: 0.1437336379198344
  # 2026-07-25 갱신: 플레이스홀더 -> 실제 testnet 잔고(account.initial_equity_usd와
  # 동일 값). ★ 이 값은 라이브 경로(scheduler.py)에서 전혀 안 쓰인다 —
  # strategies/portfolio_combined.py(scripts/diag/의 백테스트·진단 스크립트
  # 전용)에서만 참조되고, scheduler.py는 이 모듈을 import조차 안 한다(실측
  # 확인). 그래도 gate_verify류 diag 스크립트가 재실행될 때 최신 잔고
  # 기준으로 나오도록 동일하게 갱신해둔다.
  total_capital_usd: 10804.0669
  rebalance: "weekly"       # constant-mix(고정가중 주간 리밸런스), 복리

gates:
  g2_min_oos_trades: 300
  # 2026-07-25: PF 단일 기준 대체(GATE_STRUCTURE_PROPOSAL_FINAL.md 승인,
  # SPEC.md 4절 각주2 참조) — g2_min_profit_factor는 참고 지표로만 남기고
  # 게이트 판정에는 더 이상 쓰지 않는다.
  g2_min_profit_factor: 1.3
  g2_min_sharpe_annualized: 1.0
  g2_min_calmar: 1.0
  g2_max_drawdown_pct: 15
  g2_min_positive_month_pct: 55
  g3_monte_carlo_runs: 1000
  g3_max_drawdown_p95_pct: 20
  g4_min_trades: 100
  g4_max_fill_deviation_pct: 0.05
  g4_min_profit_factor: 1.1

telegram:
  daily_summary_time_kst: "09:00"
