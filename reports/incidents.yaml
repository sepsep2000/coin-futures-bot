# reports/incidents.yaml — 사고 이벤트 레지스트리
#
# "사고 제외 순수 realized PnL" 자동 집계(src/live/incident_pnl.py,
# scripts/daily_report.py)가 참조하는 유일한 사고 정의 소스. 새 사고가
# 확정되면 아래 형식으로 incidents 리스트에 항목만 추가한다 — 코드 수정
# 불필요, daily_report.py가 다음 실행부터 자동 반영한다.
#
# 매칭 규칙(src/live/incident_pnl.py::classify):
#   income 레코드가 [start, end) 시간창 안에 있고 symbols에 포함되면
#   "사고분"으로 분류한다. symbols를 넓게/시간창을 길게 잡으면 사고와
#   무관한 정상 활동(예: 같은 기간 다른 심볼의 펀딩비)까지 잘못 사고로
#   분류될 수 있으니, 항상 실측 문서(report 필드)의 타임스탬프 기준으로
#   최대한 좁게 잡는다.
#
# pnl_impact: false인 항목은 집계에서 항상 0으로 취급한다(거래/PnL
# 영향이 없는 순수 인프라 장애를 문서화 목적으로만 등록할 때 사용).
#
# g4_start: 현재 실거래 세션(G4) 시작 시각 - daily_report.py의 "누적
# 순수 전략 수익" 계산 시작점으로 사용.

